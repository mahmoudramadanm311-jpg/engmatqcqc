<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EngMat QC — Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0054F5;          /* أزرق ختم التطبيق */
    --ink-soft: #E6EEFF;
    --page: #EEF2F8;
    --paper: #FFFFFF;
    --text: #12203A;
    --muted: #5B6B86;
    --rule: #D8E0EE;
    --pass: #0F8A5F;
    --fail: #C7362F;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #6B9BFF; --ink-soft: #1A2A4D; --page: #0E1626; --paper: #16213A;
      --text: #E6ECF7; --muted: #9AA8C2; --rule: #2A3858; --pass: #3CCB8F; --fail: #FF7A70;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--text);
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px 14px; }
  .brand { font-weight: 900; font-size: 18px; letter-spacing: .2px; }
  .brand span { color: var(--ink); }
  .lang { background: none; border: 1px solid var(--rule); color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .lang:focus-visible, .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .sheet { position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 20px 18px; overflow: hidden; }
  h1 { font-size: 22px; font-weight: 900; margin: 0 0 4px; line-height: 1.35; padding-inline-end: 96px; unicode-bidi: plaintext; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; padding-inline-end: 96px; }

  /* الختم: نفس ختم CALCULATED المطبوع على التقرير */
  .stamp {
    position: absolute; inset-inline-end: 14px; top: 16px; width: 92px; height: 92px;
    border: 3px solid var(--ink); border-radius: 50%; color: var(--ink);
    display: grid; place-items: center; transform: rotate(-12deg); opacity: .9;
  }
  .stamp::before { content: ''; position: absolute; inset: 5px; border: 1px solid var(--ink); border-radius: 50%; }
  .stamp b { font-size: 9.5px; font-weight: 900; letter-spacing: .2px; direction: ltr; }
  .stamp small { display: block; font-size: 7.5px; font-weight: 700; text-align: center; direction: ltr; }
  @media (prefers-reduced-motion: no-preference) {
    .stamp { animation: press .5s cubic-bezier(.2,.9,.3,1.3) both .15s; }
    @keyframes press { from { transform: rotate(-12deg) scale(1.5); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .9; } }
  }

  dl { margin: 0; }
  .row { display: grid; grid-template-columns: 38% 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
  dt { color: var(--muted); font-size: 14px; font-weight: 600; }
  dd { margin: 0; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .num { direction: ltr; unicode-bidi: plaintext; font-variant-numeric: tabular-nums; }
  .result dd { font-size: 20px; font-weight: 900; }
  .status { display: inline-block; padding: 2px 12px; border-radius: 999px; font-weight: 900; font-size: 14px; }
  .status.ok { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .status.no { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }

  .note { color: var(--muted); font-size: 12.5px; margin: 16px 0 0; }
  .empty { text-align: center; padding: 26px 8px; }
  .empty p { color: var(--muted); }

  .get { margin-top: 18px; padding: 18px 20px; background: var(--ink-soft); border-radius: 14px; }
  .get p { margin: 0 0 12px; font-weight: 700; }
  .cta { display: block; text-align: center; background: var(--ink); color: #fff; text-decoration: none; font-weight: 900; padding: 13px 16px; border-radius: 10px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">EngMat<span> QC</span></div>
    <button class="lang" id="langBtn" type="button">English</button>
  </header>

  <main class="sheet" id="sheet" aria-live="polite"></main>

  <section class="get">
    <p id="getText"></p>
    <a class="cta" id="getBtn" href="https://play.google.com/store/apps/details?id=com.ad.qc" rel="noopener"></a>
  </section>
  <footer id="foot"></footer>
</div>

<script>
  // البيانات مضمّنة في الرابط بعد # بصيغة base64url(JSON) — يولّدها التطبيق في geoReportUrl
  var TX = {
    ar: { dir: 'rtl', other: 'English', title: 'تقرير اختبار', sub: 'صادر من تطبيق EngMat QC لضبط جودة المواد',
      r: 'رقم المرجع', t: 'الاختبار', s: 'المواصفة / المطلوب', v: 'النتيجة', k: 'الحالة', p: 'المشروع', n: 'العينة', d: 'التاريخ',
      note: 'الصفحة دي بتعرض البيانات المكتوبة جوه رمز QR بتاع التقرير. الاعتماد النهائي بيكون من النسخة الموقّعة من الجهة المصدرة.',
      emptyT: 'الرابط ده مش فيه بيانات تقرير', emptyP: 'امسح رمز QR من التقرير المطبوع مرة تانية، أو اطلب من مُصدر التقرير يبعتلك الرابط كامل.',
      get: 'احسب اختبارات الخرسانة والتربة والأسفلت وطلّع تقارير زي دي من موبايلك:', btn: 'حمّل EngMat QC من Google Play',
      foot: 'EngMat QC — أدوات ضبط جودة لمهندسي الموقع' },
    en: { dir: 'ltr', other: 'العربية', title: 'Test report', sub: 'Issued with the EngMat QC materials QC app',
      r: 'Reference', t: 'Test', s: 'Standard / required', v: 'Result', k: 'Status', p: 'Project', n: 'Sample', d: 'Date',
      note: 'This page shows the data written inside the report QR code. The signed copy from the issuing party remains the official record.',
      emptyT: 'This link has no report data', emptyP: 'Scan the QR code on the printed report again, or ask the issuer to send the full link.',
      get: 'Calculate concrete, soil and asphalt tests and produce reports like this on your phone:', btn: 'Get EngMat QC on Google Play',
      foot: 'EngMat QC — QC tools for site engineers' }
  };
  function decode(hash) {
    try {
      var b = hash.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
      if (!b) return null;
      while (b.length % 4) b += '=';
      var o = JSON.parse(decodeURIComponent(escape(atob(b))));
      return o && typeof o === 'object' ? o : null;
    } catch (e) { return null; }
  }
  // الحالة بلغة الصفحة (البيانات ممكن تكون محفوظة بأي لغة)
  var STATUS = { en: { 'مقبول': 'Accepted', 'مرفوض': 'Rejected', 'مكتمل': 'Completed' }, ar: { 'Accepted': 'مقبول', 'Rejected': 'مرفوض', 'Completed': 'مكتمل', 'Complete': 'مكتمل' } };
  // الجزء الإنجليزي بين قوسين في اسم عربي ما ينكسرش على سطرين (وإلا الأقواس بتتقلب)
  function keepParens(h) { return h.replace(/\(([^()]{1,40})\)/g, '<span style="white-space:nowrap">(<bdi>$1</bdi>)</span>'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  var lang = /^ar/i.test(navigator.language || 'ar') ? 'ar' : 'en';
  function render() {
    var L = TX[lang], data = decode(location.hash);
    document.documentElement.lang = lang; document.documentElement.dir = L.dir;
    document.getElementById('langBtn').textContent = L.other;
    document.getElementById('getText').textContent = L.get;
    document.getElementById('getBtn').textContent = L.btn;
    document.getElementById('foot').textContent = L.foot;
    var sheet = document.getElementById('sheet');
    if (!data) {
      sheet.innerHTML = '<div class="empty"><h1 style="padding:0">' + esc(L.emptyT) + '</h1><p>' + esc(L.emptyP) + '</p></div>';
      return;
    }
    var okWords = /مقبول|مكتمل|accept|pass|complete/i, noWords = /مرفوض|reject|fail/i;
    var rows = '';
    ['v', 'k', 's', 'p', 'n', 'd', 'r'].forEach(function (key) {   // اسم الاختبار في العنوان
      if (data[key] == null || data[key] === '') return;
      var val = esc(data[key]);
      if (key === 'k') {
        var st = String(data[key]).trim(), stTxt = (STATUS[lang] && STATUS[lang][st]) || st;
        val = '<span class="status ' + (noWords.test(st) ? 'no' : okWords.test(st) ? 'ok' : '') + '">' + esc(stTxt) + '</span>';
      }
      var numeric = key === 'v' || key === 'd' || key === 'r' || key === 's';
      rows += '<div class="row' + (key === 'v' ? ' result' : '') + '"><dt>' + esc(L[key]) + '</dt><dd' + (numeric ? ' class="num"' : '') + '>' + val + '</dd></div>';
    });
    sheet.innerHTML =
      '<div class="stamp" aria-hidden="true"><div><b>CALCULATED</b><small>EngMat QC</small></div></div>' +
      '<h1>' + keepParens(esc(data.t || L.title)) + '</h1><p class="sub">' + esc(L.sub) + '</p>' +
      '<dl>' + rows + '</dl><p class="note">' + esc(L.note) + '</p>';
    document.title = (data.t ? data.t + ' — ' : '') + 'EngMat QC';
  }
  document.getElementById('langBtn').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; render(); });
  window.addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
